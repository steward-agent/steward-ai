name: Open PR to main

on:
  push:
    branches:
      - dev
      - UAT
      - "feature/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    if: github.ref_name != 'main'
    steps:
      - name: Ensure pull request into main
        uses: actions/github-script@v7
        with:
          # Prefer STEWARD_PR_TOKEN when the org blocks GITHUB_TOKEN from creating PRs.
          github-token: ${{ secrets.STEWARD_PR_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const head = context.ref.replace(/^refs\/heads\//, '');
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${head}`,
              base: 'main',
            });

            if (existing.data.length > 0) {
              core.info(`Open pull request #${existing.data[0].number} already targets main from ${head}.`);
              core.info(existing.data[0].html_url);
              return;
            }

            try {
              const created = await github.rest.pulls.create({
                owner,
                repo,
                title: `Promote ${head} into main`,
                head,
                base: 'main',
                body: [
                  '## Summary',
                  `Automated pull request from \`${head}\` into \`main\`.`,
                  '',
                  '## Source',
                  `- Branch: \`${head}\``,
                  `- Commit: \`${context.sha}\``,
                  '- Workflow: Open PR to main',
                  '',
                  '## Test plan',
                  '- [ ] CI is green on this pull request',
                  '- [ ] Reviewers confirm the change is ready for `main`',
                ].join('\n'),
              });

              core.info(`Created pull request #${created.data.number}`);
              core.info(created.data.html_url);
            } catch (error) {
              const status = error.status || error.response?.status;
              const message = error.message || String(error);

              if (status === 422 && /No commits between/i.test(message)) {
                core.info(`${head} and main have the same commit history; no pull request needed.`);
                return;
              }

              if (status === 403 && /not permitted to create or approve pull requests/i.test(message)) {
                // Warn instead of failing: the push is fine, only the automatic PR is skipped.
                core.warning([
                  'GitHub Actions cannot create pull requests with the current token. Open the pull request by hand.',
                  '',
                  'Fix one of the following:',
                  '1) Org admin: https://github.com/organizations/steward-agent/settings/actions',
                  '   → Workflow permissions → Read and write permissions',
                  '   → Enable "Allow GitHub Actions to create and approve pull requests"',
                  '2) Repo secret STEWARD_PR_TOKEN: a fine-grained or classic PAT with pull-requests write',
                  '   on steward-agent/steward-ai, then re-run this workflow.',
                ].join('\n'));
                return;
              }

              throw error;
            }
