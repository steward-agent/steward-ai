[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-agent"
version = "0.1.0"
description = "Open-source store plugin for customer service, refunds, settlement, and payment conversion on the merchant's own payment systems."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Ecommerce Agent contributors" }]
keywords = ["ecommerce", "agents", "refunds", "payments", "open-source"]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.6",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ecommerce-agent = "ecommerce_agent.__main__:main"

[project.entry-points."ecommerce_agent.payment_plugins"]
mock = "ecommerce_agent.plugins.payments:MockPaymentPlugin"
http = "ecommerce_agent.plugins.payments:HttpPaymentPlugin"
stripe = "ecommerce_agent.plugins.payments:StripePaymentPlugin"
paystack = "ecommerce_agent.plugins.paystack:PaystackPaymentPlugin"
flutterwave = "ecommerce_agent.plugins.flutterwave:FlutterwavePaymentPlugin"
shopify = "ecommerce_agent.plugins.shopify:ShopifyPaymentPlugin"

[project.entry-points."ecommerce_agent.commerce_plugins"]
mock = "ecommerce_agent.plugins.commerce:MockCommercePlugin"
http = "ecommerce_agent.plugins.commerce:HttpCommercePlugin"
shopify = "ecommerce_agent.plugins.shopify:ShopifyCommercePlugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ecommerce_agent = ["static/*", "policies/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
